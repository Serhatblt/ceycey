<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gülüm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Alex+Brush&family=Allura&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@1,600&family=Dancing+Script:wght@700&family=Great+Vibes&family=Lobster&family=Marck+Script&family=Pacifico&family=Pinyon+Script&family=Playfair+Display:ital,wght@1,700&family=Sacramento&family=Satisfy&family=Tangerine:wght@700&display=swap"
    rel="stylesheet"
  />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #020308;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      display: block;
    }
    .font-preloader {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      font-size: 10px;
    }

    /* --- GİRİŞ EKRANI KATMANI --- */
    .intro-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      z-index: 10;
      background: radial-gradient(circle at center, rgba(10, 26, 68, 0.28) 0%, rgba(2, 3, 8, 0.96) 75%);
      transition: opacity 0.85s ease, transform 0.85s ease;
    }

    .intro-overlay.hidden {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    .intro-text {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(36px, 7vw, 62px);
      line-height: 1.3;
      color: #a8d8ff;
      text-shadow:
        0 0 14px rgba(56, 152, 255, 0.85),
        0 0 32px rgba(24, 108, 255, 0.65);
      margin-bottom: 34px;
      letter-spacing: 0.5px;
      animation: fadeInDown 1.1s ease-out both;
    }

    .heart-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      outline: none;
      animation: heartbeat 1.6s ease-in-out infinite;
      transition: transform 0.25s ease;
    }

    .heart-btn:hover {
      transform: scale(1.14);
    }

    .heart-btn:active {
      transform: scale(0.94);
    }

    .heart-svg {
      width: 64px;
      height: 64px;
      filter: drop-shadow(0 0 14px rgba(255, 42, 98, 0.85))
              drop-shadow(0 0 28px rgba(235, 20, 74, 0.55));
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      18% {
        transform: scale(1.13);
      }
      34% {
        transform: scale(0.98);
      }
      50% {
        transform: scale(1.09);
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <!-- GİRİŞ YAZISI VE PEMBE-KIRMIZI KALP BUTONU -->
  <div class="intro-overlay" id="introOverlay">
    <p class="intro-text">Dünyanın ve dünyamın en güzel kızına</p>
    <button class="heart-btn" id="startBtn" aria-label="Animasyonu Başlat">
      <svg class="heart-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="pinkRedHeart" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ff4d7d" />
            <stop offset="55%" stop-color="#ff245b" />
            <stop offset="100%" stop-color="#d90f42" />
          </linearGradient>
        </defs>
        <path
          d="M16 28.2C16 28.2 3.5 20.1 3.5 11.1C3.5 6.9 6.8 3.8 10.8 3.8C13.2 3.8 15.1 4.9 16 6.7C16.9 4.9 18.8 3.8 21.2 3.8C25.2 3.8 28.5 6.9 28.5 11.1C28.5 20.1 16 28.2 16 28.2Z"
          fill="url(#pinkRedHeart)"
        />
      </svg>
    </button>
  </div>

  <div class="font-preloader" aria-hidden="true">
    <span style="font-family: 'Great Vibes'">Gülüm</span>
    <span style="font-family: 'Playfair Display'">Gülüm</span>
    <span style="font-family: 'Alex Brush'">Gülüm</span>
    <span style="font-family: 'Cinzel Decorative'">Gülüm</span>
    <span style="font-family: 'Dancing Script'">Gülüm</span>
    <span style="font-family: 'Sacramento'">Gülüm</span>
    <span style="font-family: 'Cormorant Garamond'">Gülüm</span>
    <span style="font-family: 'Pacifico'">Gülüm</span>
    <span style="font-family: 'Lobster'">Gülüm</span>
    <span style="font-family: 'Allura'">Gülüm</span>
    <span style="font-family: 'Tangerine'">Gülüm</span>
    <span style="font-family: 'Pinyon Script'">Gülüm</span>
    <span style="font-family: 'Marck Script'">Gülüm</span>
    <span style="font-family: 'Abril Fatface'">Gülüm</span>
    <span style="font-family: 'Satisfy'">Gülüm</span>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const ustYazi = "Gülüm";
    let isStarted = false;

    const introOverlay = document.getElementById("introOverlay");
    const startBtn = document.getElementById("startBtn");

    startBtn.addEventListener("click", () => {
      if (isStarted) return;
      isStarted = true;
      introOverlay.classList.add("hidden");
      setTimeout(() => {
        introOverlay.style.display = "none";
      }, 880);
    });

    const fontStyles = [
      {
        font: "400 80px 'Great Vibes', cursive",
        fill: "rgba(215, 236, 255, 0.96)",
        glow: "rgba(32, 110, 255, 0.92)",
      },
      {
        font: "italic 700 66px 'Playfair Display', serif",
        fill: "rgba(195, 226, 255, 0.96)",
        glow: "rgba(56, 138, 255, 0.92)",
      },
      {
        font: "400 82px 'Alex Brush', cursive",
        fill: "rgba(225, 242, 255, 0.96)",
        glow: "rgba(24, 98, 245, 0.92)",
      },
      {
        font: "700 56px 'Cinzel Decorative', serif",
        fill: "rgba(205, 232, 255, 0.96)",
        glow: "rgba(70, 150, 255, 0.92)",
      },
      {
        font: "700 72px 'Dancing Script', cursive",
        fill: "rgba(220, 240, 255, 0.96)",
        glow: "rgba(30, 115, 255, 0.92)",
      },
      {
        font: "400 86px 'Sacramento', cursive",
        fill: "rgba(210, 235, 255, 0.96)",
        glow: "rgba(45, 130, 255, 0.92)",
      },
      {
        font: "italic 600 72px 'Cormorant Garamond', serif",
        fill: "rgba(225, 243, 255, 0.96)",
        glow: "rgba(28, 105, 250, 0.92)",
      },
      {
        font: "400 64px 'Pacifico', cursive",
        fill: "rgba(205, 234, 255, 0.96)",
        glow: "rgba(50, 140, 255, 0.92)",
      },
      {
        font: "400 68px 'Lobster', cursive",
        fill: "rgba(218, 238, 255, 0.96)",
        glow: "rgba(35, 118, 255, 0.92)",
      },
      {
        font: "400 84px 'Allura', cursive",
        fill: "rgba(222, 241, 255, 0.96)",
        glow: "rgba(25, 102, 248, 0.92)",
      },
      {
        font: "700 96px 'Tangerine', cursive",
        fill: "rgba(210, 236, 255, 0.96)",
        glow: "rgba(58, 142, 255, 0.92)",
      },
      {
        font: "400 78px 'Pinyon Script', cursive",
        fill: "rgba(225, 243, 255, 0.96)",
        glow: "rgba(30, 112, 255, 0.92)",
      },
      {
        font: "400 74px 'Marck Script', cursive",
        fill: "rgba(202, 231, 255, 0.96)",
        glow: "rgba(42, 128, 255, 0.92)",
      },
      {
        font: "400 60px 'Abril Fatface', serif",
        fill: "rgba(215, 238, 255, 0.96)",
        glow: "rgba(65, 148, 255, 0.92)",
      },
      {
        font: "400 72px 'Satisfy', cursive",
        fill: "rgba(220, 240, 255, 0.96)",
        glow: "rgba(28, 108, 252, 0.92)",
      },
    ];

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    const clamp = (val, min, max) => Math.max(min, Math.min(max, val));
    const easeOutQuad = (t) => 1 - (1 - t) * (1 - t);
    const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
    const easeOutSine = (t) => Math.sin((t * Math.PI) / 2);

    function getBezierPoint(t, p0, p1, p2) {
      const u = 1 - t;
      return {
        x: u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x,
        y: u * u * p0.y + 2 * u * t * p1.y + t * t * p2.y,
      };
    }

    function getBezierAngle(t, p0, p1, p2) {
      const dx = 2 * (1 - t) * (p1.x - p0.x) + 2 * t * (p2.x - p1.x);
      const dy = 2 * (1 - t) * (p1.y - p0.y) + 2 * t * (p2.y - p1.y);
      return Math.atan2(dy, dx);
    }

    // --- YAZININ SAĞINDAN SOLUNDAN SÜZÜLEN KIRMIZI KALPLER ---
    class HeartParticle {
      constructor(originX, originY, side) {
        this.side = side;
        this.x = originX + side * (96 + Math.random() * 42);
        this.y = originY + (Math.random() - 0.5) * 34;
        this.size = 6.0 + Math.random() * 5.2;
        this.vy = -(0.35 + Math.random() * 0.45);
        this.vx = side * (0.12 + Math.random() * 0.25);
        this.wobblePhase = Math.random() * Math.PI * 2;
        this.wobbleSpeed = 0.03 + Math.random() * 0.025;
        this.tilt = (Math.random() - 0.5) * 0.45;
        this.life = 0;
        this.maxLife = 135 + Math.random() * 65;

        const palette = [
          { fill: "rgba(255, 32, 62, 0.95)", glow: "rgba(255, 18, 48, 0.9)" },
          { fill: "rgba(232, 16, 44, 0.95)", glow: "rgba(220, 10, 38, 0.9)" },
          { fill: "rgba(255, 64, 88, 0.94)", glow: "rgba(255, 30, 60, 0.88)" },
          { fill: "rgba(205, 10, 36, 0.96)", glow: "rgba(245, 22, 52, 0.92)" },
        ];
        this.color = palette[Math.floor(Math.random() * palette.length)];
      }

      update() {
        this.life++;
        this.wobblePhase += this.wobbleSpeed;
        this.x += this.vx + Math.sin(this.wobblePhase) * 0.35;
        this.y += this.vy;
      }

      isDead() {
        return this.life >= this.maxLife;
      }

      draw(ctx) {
        const progress = this.life / this.maxLife;
        const alpha =
          progress < 0.2
            ? progress / 0.2
            : progress > 0.72
            ? 1 - (progress - 0.72) / 0.28
            : 1;

        const scale =
          (0.75 + 0.25 * Math.sin(this.wobblePhase * 1.4)) *
          (0.6 + 0.4 * Math.min(progress * 4, 1));
        const s = this.size * scale;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.tilt + Math.sin(this.wobblePhase) * 0.14);
        ctx.globalAlpha = clamp(alpha, 0, 1);

        ctx.shadowColor = this.color.glow;
        ctx.shadowBlur = 12;
        ctx.fillStyle = this.color.fill;

        ctx.beginPath();
        ctx.moveTo(0, s * 0.35);
        ctx.bezierCurveTo(-s * 0.5, -s * 0.25, -s * 1.15, s * 0.2, 0, s * 1.05);
        ctx.bezierCurveTo(s * 1.15, s * 0.2, s * 0.5, -s * 0.25, 0, s * 0.35);
        ctx.fill();

        ctx.restore();
      }
    }

    // --- YEŞİL GÖVDE YAPRAĞI SINIFI ---
    class Leaf {
      constructor(tOnStem, side, maxLength) {
        this.tOnStem = tOnStem;
        this.side = side;
        this.maxLength = maxLength;
        this.growth = 0;
      }

      update(stemProgress) {
        if (stemProgress > this.tOnStem) {
          this.growth = clamp(this.growth + 0.011, 0, 1);
        }
      }

      draw(ctx, pos, stemAngle) {
        if (this.growth <= 0) return;

        const ease = easeOutCubic(this.growth);
        const len = this.maxLength * ease;
        const wid = len * 0.25;
        const angle = stemAngle + this.side * 0.62;

        ctx.save();
        ctx.translate(pos.x, pos.y);
        ctx.rotate(angle);

        const grad = ctx.createLinearGradient(0, 0, len, 0);
        grad.addColorStop(0, "#1c5426");
        grad.addColorStop(1, "#44a84f");

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(len * 0.5, -wid, len, 0);
        ctx.quadraticCurveTo(len * 0.5, wid, 0, 0);
        ctx.fill();

        ctx.strokeStyle = "rgba(145, 235, 155, 0.28)";
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(len * 0.85, 0);
        ctx.stroke();

        ctx.restore();
      }
    }

    // --- ÜST ÜSTE KATMANLI TEKEL MAVİSİ GÜL SINIFI ---
    class RoseFlower {
      constructor(maxRadius, layers, baseHue) {
        this.maxRadius = maxRadius;
        this.layers = layers;
        this.baseHue = baseHue;
        this.bloom = 0;
        this.budGlow = 0;
      }

      update(stemProgress) {
        if (stemProgress >= 0.84) {
          this.budGlow = clamp(this.budGlow + 0.022, 0, 1);
        }
        if (stemProgress >= 0.92) {
          this.bloom = clamp(this.bloom + 0.0052, 0, 1);
        }
      }

      drawLightRays(ctx, pos, time, swayOffset) {
        if (this.bloom <= 0) return;

        const bloomEase = easeOutSine(this.bloom);

        ctx.save();
        ctx.translate(pos.x, pos.y);
        ctx.globalCompositeOperation = "screen";

        const haloRadius = this.maxRadius * 2.15 * bloomEase;
        const haloGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, haloRadius);
        haloGrad.addColorStop(0, `hsla(${this.baseHue - 2}, 96%, 54%, ${0.22 * bloomEase})`);
        haloGrad.addColorStop(0.5, `hsla(${this.baseHue}, 92%, 42%, ${0.09 * bloomEase})`);
        haloGrad.addColorStop(1, `hsla(${this.baseHue + 3}, 90%, 25%, 0)`);

        ctx.fillStyle = haloGrad;
        ctx.beginPath();
        ctx.arc(0, 0, haloRadius, 0, Math.PI * 2);
        ctx.fill();

        const rayCount = 12;
        for (let i = 0; i < rayCount; i++) {
          const rayAngle =
            -Math.PI / 2 +
            (i / rayCount) * Math.PI * 2 +
            time * 0.05 +
            swayOffset * 0.25;

          const shimmer = 0.78 + 0.22 * Math.sin(time * 1.2 + i * 2.1);
          const rayLength =
            this.maxRadius * (1.7 + (i % 3) * 0.28) * bloomEase * shimmer;
          const rayHalfWidth = rayLength * (0.055 + (i % 2) * 0.02);

          ctx.save();
          ctx.rotate(rayAngle);

          const rayGrad = ctx.createLinearGradient(0, 0, rayLength, 0);
          rayGrad.addColorStop(
            0,
            `hsla(${this.baseHue - 3}, 96%, 60%, ${0.1 * bloomEase * shimmer})`
          );
          rayGrad.addColorStop(
            0.5,
            `hsla(${this.baseHue}, 92%, 46%, ${0.035 * bloomEase * shimmer})`
          );
          rayGrad.addColorStop(1, `hsla(${this.baseHue + 2}, 90%, 35%, 0)`);

          ctx.fillStyle = rayGrad;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(rayLength, -rayHalfWidth);
          ctx.lineTo(rayLength, rayHalfWidth);
          ctx.closePath();
          ctx.fill();

          ctx.restore();
        }

        ctx.restore();
      }

      drawSinglePetal(ctx, reach, widthSpread, cupDepth, ease, lightness, alpha, isOuterLayer) {
        const len = reach * (0.22 + 0.78 * ease);
        const wid = widthSpread * (0.28 + 0.72 * ease);
        const notch = (isOuterLayer ? 0.1 : 0.045) * len * ease;

        const petalGrad = ctx.createRadialGradient(
          len * 0.22,
          0,
          len * 0.05,
          len * 0.68,
          0,
          len * 1.15
        );
        petalGrad.addColorStop(
          0,
          `hsla(${this.baseHue + 7}, 98%, ${Math.max(lightness - 18, 15)}%, ${alpha})`
        );
        petalGrad.addColorStop(
          0.55,
          `hsla(${this.baseHue}, 95%, ${lightness}%, ${alpha})`
        );
        petalGrad.addColorStop(
          1,
          `hsla(${this.baseHue - 6}, 100%, ${Math.min(lightness + 18, 76)}%, 1)`
        );

        ctx.fillStyle = petalGrad;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(
          len * 0.36,
          -wid * 0.92 - cupDepth * ease,
          len * 0.88,
          -wid * 0.74,
          len,
          -notch
        );
        ctx.quadraticCurveTo(
          len * (0.94 - cupDepth * 0.015),
          0,
          len,
          notch
        );
        ctx.bezierCurveTo(
          len * 0.88,
          wid * 0.74,
          len * 0.36,
          wid * 0.92 + cupDepth * ease,
          0,
          0
        );
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = `hsla(${this.baseHue + 6}, 95%, ${Math.max(lightness - 14, 17)}%, ${0.38 * ease})`;
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.moveTo(len * 0.12, 0);
        ctx.quadraticCurveTo(len * 0.52, wid * 0.12 * Math.sin(cupDepth), len * 0.84, 0);
        ctx.stroke();

        ctx.strokeStyle = `hsla(${this.baseHue - 5}, 100%, ${Math.min(lightness + 24, 82)}%, ${0.42 * ease})`;
        ctx.lineWidth = 1.05;
        ctx.beginPath();
        ctx.moveTo(len * 0.35, -wid * 0.82);
        ctx.bezierCurveTo(len * 0.86, -wid * 0.72, len, -notch, len, notch);
        ctx.bezierCurveTo(len, wid * 0.72, len * 0.86, wid * 0.82, len * 0.35, wid * 0.82);
        ctx.stroke();
      }

      draw(ctx, pos, time, swayOffset) {
        if (this.budGlow <= 0 && this.bloom <= 0) return;

        ctx.save();
        ctx.translate(pos.x, pos.y);
        ctx.rotate(swayOffset * 0.35);

        for (let l = 0; l < this.layers; l++) {
          const layerRatio = this.layers > 1 ? l / (this.layers - 1) : 0;
          const petalCount = Math.round(5 + layerRatio * 3.5);
          const isOuterLayer = l >= this.layers - 2;

          const layerWindowStart = (l / this.layers) * 0.64;
          const layerWindowSpan = 0.36;

          const lightness = 50 - layerRatio * 13;
          const alpha = 0.96 - layerRatio * 0.04;
          const baseRotation = l * 0.55 + Math.sin(time * 0.85 + l * 0.7) * 0.012;

          const reach = this.maxRadius * (0.2 + layerRatio * 0.8);
          const angularStep = (Math.PI * 2) / petalCount;
          const widthSpread = reach * Math.sin(angularStep * 0.45);
          const cupDepth = (isOuterLayer ? 4.4 : 2.2) * layerRatio;

          for (let i = 0; i < petalCount; i++) {
            const petalOrderRatio = i / petalCount;
            const petalStart =
              layerWindowStart + petalOrderRatio * (layerWindowSpan * 0.64);
            const petalDuration = layerWindowSpan * 0.7;
            const rawPetalProgress = clamp(
              (this.bloom - petalStart) / petalDuration,
              0,
              1
            );

            if (rawPetalProgress <= 0) continue;

            const ease = easeOutCubic(rawPetalProgress);
            const angle = baseRotation + i * angularStep;
            const flutter =
              Math.sin(time * 1.1 + l * 1.4 + i * 1.9) * 0.02 * ease;

            ctx.save();
            ctx.rotate(angle + flutter);
            ctx.globalAlpha = clamp(ease * 1.25, 0, 1);

            ctx.shadowColor = `rgba(3, 12, 42, ${0.72 * ease})`;
            ctx.shadowBlur = 9;
            ctx.shadowOffsetX = 1.6;
            ctx.shadowOffsetY = 2.2;

            this.drawSinglePetal(
              ctx,
              reach,
              widthSpread,
              cupDepth,
              ease,
              lightness,
              alpha,
              isOuterLayer
            );

            ctx.restore();
          }
        }

        const budScale = Math.max(
          easeOutCubic(this.budGlow) * 0.72,
          easeOutCubic(Math.min(this.bloom * 2.4, 1))
        );
        if (budScale > 0) {
          const centerR = this.maxRadius * 0.16 * budScale;
          ctx.save();
          ctx.rotate(time * 0.35);

          ctx.shadowColor = "rgba(18, 88, 235, 0.75)";
          ctx.shadowBlur = 10;

          const centerGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, centerR * 1.2);
          centerGrad.addColorStop(0, "rgba(16, 58, 165, 0.98)");
          centerGrad.addColorStop(0.65, "rgba(24, 92, 225, 0.94)");
          centerGrad.addColorStop(1, "rgba(110, 190, 255, 0.7)");

          ctx.fillStyle = centerGrad;
          ctx.beginPath();
          ctx.arc(0, 0, centerR, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = "rgba(195, 234, 255, 0.85)";
          ctx.lineWidth = 1.35;
          ctx.beginPath();
          for (let a = 0; a <= Math.PI * 3.4; a += 0.25) {
            const r = (a / (Math.PI * 3.4)) * centerR * 0.85;
            const sx = Math.cos(a) * r;
            const sy = Math.sin(a) * r;
            if (a === 0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
          }
          ctx.stroke();

          ctx.restore();
        }

        ctx.restore();
      }
    }

    // --- SAP (GÖVDE) SINIFI ---
    class Stem {
      constructor(config) {
        this.startOffsetX = config.startOffsetX;
        this.ctrlOffsetX = config.ctrlOffsetX;
        this.ctrlOffsetY = config.ctrlOffsetY;
        this.endOffsetX = config.endOffsetX;
        this.endOffsetY = config.endOffsetY;
        this.speed = config.speed;
        this.delay = config.delay;
        this.leaves = config.leaves || [];
        this.flower = config.flower;
        this.swayPhase = config.swayPhase || 0;
        this.progress = 0;
        this.timer = 0;
      }

      update() {
        this.timer++;
        if (this.timer < this.delay) return;

        this.progress = clamp(this.progress + this.speed, 0, 1);
        this.leaves.forEach((leaf) => leaf.update(this.progress));
        this.flower.update(this.progress);
      }

      getCurveData(time) {
        const baseX = width / 2;
        const baseY = height / 2 + 255;
        const sway = Math.sin(time + this.swayPhase) * 9 * this.progress;

        const p0 = { x: baseX + this.startOffsetX, y: baseY };
        const p1 = {
          x: baseX + this.ctrlOffsetX + sway * 0.5,
          y: baseY - this.ctrlOffsetY,
        };
        const p2 = {
          x: baseX + this.endOffsetX + sway,
          y: baseY - this.endOffsetY,
        };
        const ease = easeOutQuad(this.progress);

        return { p0, p1, p2, ease, sway };
      }

      drawRays(ctx, time) {
        if (this.progress <= 0) return;
        const { p0, p1, p2, ease, sway } = this.getCurveData(time);
        const tipPos = getBezierPoint(ease, p0, p1, p2);
        this.flower.drawLightRays(ctx, tipPos, time, sway * 0.015);
      }

      draw(ctx, time) {
        if (this.progress <= 0) return;

        const { p0, p1, p2, ease, sway } = this.getCurveData(time);
        const steps = 42;

        for (let i = 0; i < steps; i++) {
          const t1 = (i / steps) * ease;
          const t2 = ((i + 1) / steps) * ease;

          const pt1 = getBezierPoint(t1, p0, p1, p2);
          const pt2 = getBezierPoint(t2, p0, p1, p2);

          ctx.strokeStyle = i < steps * 0.3 ? "#1f5928" : "#3a9143";
          ctx.lineWidth = 3.5 * (1 - t1 * 0.52);
          ctx.lineCap = "round";

          ctx.beginPath();
          ctx.moveTo(pt1.x, pt1.y);
          ctx.lineTo(pt2.x, pt2.y);
          ctx.stroke();
        }

        this.leaves.forEach((leaf) => {
          const pos = getBezierPoint(leaf.tOnStem, p0, p1, p2);
          const angle = getBezierAngle(leaf.tOnStem, p0, p1, p2);
          leaf.draw(ctx, pos, angle);
        });

        const tipPos = getBezierPoint(ease, p0, p1, p2);
        this.flower.draw(ctx, tipPos, time, sway * 0.015);
      }
    }

    // --- SAHNE KURULUMU (6 BAĞIMSIZ DAL -> 8 KATMANLI 6 TEKEL MAVİSİ GÜL) ---
    const stems = [
      new Stem({
        startOffsetX: 0,
        ctrlOffsetX: -8,
        ctrlOffsetY: 205,
        endOffsetX: 0,
        endOffsetY: 385,
        speed: 0.0085,
        delay: 0,
        swayPhase: 0,
        leaves: [
          new Leaf(0.24, -1, 44),
          new Leaf(0.36, 1, 46),
          new Leaf(0.68, -1, 38),
        ],
        flower: new RoseFlower(74, 8, 220),
      }),
      new Stem({
        startOffsetX: 0,
        ctrlOffsetX: -66,
        ctrlOffsetY: 170,
        endOffsetX: -132,
        endOffsetY: 318,
        speed: 0.0085,
        delay: 20,
        swayPhase: 0.8,
        leaves: [
          new Leaf(0.36, -1, 38),
          new Leaf(0.64, 1, 34),
        ],
        flower: new RoseFlower(56, 8, 221),
      }),
      new Stem({
        startOffsetX: 0,
        ctrlOffsetX: 68,
        ctrlOffsetY: 175,
        endOffsetX: 136,
        endOffsetY: 325,
        speed: 0.0085,
        delay: 26,
        swayPhase: 1.6,
        leaves: [
          new Leaf(0.36, 1, 38),
          new Leaf(0.64, -1, 34),
        ],
        flower: new RoseFlower(58, 8, 219),
      }),
      new Stem({
        startOffsetX: 0,
        ctrlOffsetX: -90,
        ctrlOffsetY: 105,
        endOffsetX: -168,
        endOffsetY: 192,
        speed: 0.0085,
        delay: 38,
        swayPhase: 2.4,
        leaves: [
          new Leaf(0.45, -1, 35),
        ],
        flower: new RoseFlower(51, 8, 220),
      }),
      new Stem({
        startOffsetX: 0,
        ctrlOffsetX: 92,
        ctrlOffsetY: 108,
        endOffsetX: 172,
        endOffsetY: 198,
        speed: 0.0085,
        delay: 44,
        swayPhase: 3.2,
        leaves: [
          new Leaf(0.45, 1, 35),
        ],
        flower: new RoseFlower(53, 8, 221),
      }),
      new Stem({
        startOffsetX: 0,
        ctrlOffsetX: 12,
        ctrlOffsetY: 112,
        endOffsetX: 6,
        endOffsetY: 222,
        speed: 0.0085,
        delay: 52,
        swayPhase: 4.0,
        leaves: [
          new Leaf(0.42, -1, 34),
          new Leaf(0.56, 1, 34),
        ],
        flower: new RoseFlower(55, 8, 218),
      }),
    ];

    let time = 0;
    let textAlpha = 0;
    let fontIndex = 0;
    let lastFontSwitchTime = 0;
    let fontPopProgress = 1;
    const hearts = [];
    let heartSpawnTimer = 0;

    function drawTopText(ctx, alpha, time, now) {
      if (alpha <= 0) return;

      if (lastFontSwitchTime === 0) {
        lastFontSwitchTime = now;
      } else if (now - lastFontSwitchTime >= 300) {
        fontIndex = (fontIndex + 1) % fontStyles.length;
        lastFontSwitchTime = now;
        fontPopProgress = 0;
      }

      fontPopProgress = clamp(fontPopProgress + 0.16, 0, 1);
      const popScale = 0.91 + 0.09 * easeOutCubic(fontPopProgress);

      const ease = easeOutCubic(alpha);
      const currentStyle = fontStyles[fontIndex];
      const yOffset = (1 - ease) * 12;
      const posX = width / 2;
      const posY = height / 2 - 235 + yOffset;

      ctx.save();
      ctx.translate(posX, posY);
      ctx.scale(popScale, popScale);
      ctx.globalAlpha = ease;

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = currentStyle.font;

      ctx.shadowColor = currentStyle.glow;
      ctx.shadowBlur = 24 + (1 - fontPopProgress) * 14;
      ctx.fillStyle = currentStyle.fill;
      ctx.fillText(ustYazi, 0, 0);

      ctx.restore();
    }

    function animate(now) {
      ctx.fillStyle = "#020308";
      ctx.fillRect(0, 0, width, height);

      if (isStarted) {
        time += 0.015;

        const scale = Math.min(1, Math.min(width / 460, height / 620));

        ctx.save();
        ctx.translate(width / 2, height / 2);
        ctx.scale(scale, scale);
        ctx.translate(-width / 2, -height / 2);

        stems.forEach((stem) => stem.update());

        if (stems[0].flower.bloom > 0.25) {
          textAlpha = clamp(textAlpha + 0.014, 0, 1);
        }

        if (textAlpha > 0.35) {
          heartSpawnTimer++;
          if (heartSpawnTimer % 16 === 0 && hearts.length < 32) {
            const textCenterY = height / 2 - 235;
            hearts.push(new HeartParticle(width / 2, textCenterY, -1));
            hearts.push(new HeartParticle(width / 2, textCenterY, 1));
          }
        }

        stems.forEach((stem) => stem.drawRays(ctx, time));
        stems.forEach((stem) => stem.draw(ctx, time));

        for (let i = hearts.length - 1; i >= 0; i--) {
          hearts[i].update();
          hearts[i].draw(ctx);
          if (hearts[i].isDead()) {
            hearts.splice(i, 1);
          }
        }

        drawTopText(ctx, textAlpha, time, now || performance.now());

        ctx.restore();
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
